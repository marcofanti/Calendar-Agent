profiles:
  - name: inclubgolf
    from_pattern: "noreply@inclubgolf\\.com"
    subject_pattern: ".*"
    duration_minutes: 20
    # mailbox: "INBOX"       # optional: IMAP folder / Gmail label (default: INBOX)
    # to_pattern: ".*"       # optional: match recipient address
    # body_pattern: ".*"     # optional: match body content
    prompt_template: |
      Extract and validate one InClubGolf calendar event from this email.

      Use the deterministic_candidate as a proposed parse. Confirm it if correct; correct it if the
      email text shows different event details. This LLM response is required even when the candidate
      looks complete.

      Return one JSON object only:
      {
        "is_event": true,
        "event_type": "Practice" or "Lesson",
        "status": "Reserved" or "Canceled",
        "location": "clean location string",
        "date": "MM/DD/YYYY",
        "time": "HH:MM AM/PM",
        "confidence": number between 0 and 1
      }

      If this is not a lesson/practice reservation or cancellation, return:
      {"is_event": false, "confidence": 0}

      Rules:
      - All event times are America/New_York.
      - Do not invent missing date, time, type, status, or location.
      - Treat "cancelled" and "canceled" as "Canceled".
      - Treat confirmed/reserved bookings as "Reserved".
      - Keep the location in the form used by the email, for example "Lake Nona in North Bay".

  - name: courtreserve
    from_pattern: "notifications_at_courtreserve_com_2r6q26xw5k3936_566ad789@icloud\\.com"
    subject_pattern: ".*"
    duration_minutes: 90   # fallback only — end_time is parsed from the email body
    mailbox: "00 - OldInox"       # optional: IMAP folder / Gmail label (default: INBOX)
    body_max_chars: 500    # booking details are in the first few lines; skip legal boilerplate
    # to_pattern: ".*"       # optional: match recipient address
    # body_pattern: ".*"     # optional: match body content
    prompt_template: |
      Extract and validate one CourtReserve event registration from this email.

      These emails confirm registrations for any type of event at the facility:
      court bookings, programs, parties, clinics, social events, etc.

      The email body contains the event title, the date, and a time range.
      Example body format:
        Singles Live Ball (3.5+) FR 6:00P (Spring 2026)
        4/24/2026
        6:00 PM - 7:30 PM

      Another example (party/social):
        April 105 Party (3.5+)
        4/19/2026
        12:30 PM - 2:30 PM

      Return one JSON object only:
      {
        "is_event": true,
        "event_type": "full event title exactly as it appears in the email",
        "status": "Reserved" or "Canceled",
        "location": "facility or court name if present, otherwise empty string",
        "date": "MM/DD/YYYY",
        "start_time": "HH:MM AM/PM",
        "end_time": "HH:MM AM/PM",
        "confidence": number between 0 and 1
      }

      If this email does not contain a date and time for an event registration, return:
      {"is_event": false, "confidence": 0}

      Rules:
      - All event times are America/New_York.
      - Do not invent missing date, start_time, end_time, or event_type.
      - Treat "cancelled" and "canceled" as "Canceled".
      - Treat confirmed/reserved/booked/registered as "Reserved".
      - Derive start_time and end_time from the time range (e.g. "6:00 PM - 7:30 PM").
      - Keep the event_type exactly as the title appears in the email body.
      - ANY registration confirmation with a date and time is a valid event.
