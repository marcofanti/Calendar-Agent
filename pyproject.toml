[project]
name = "calendar-agent"
version = "0.1.0"
description = "Sync InClubGolf emails into Google Calendar, Outlook, and ICS files."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.170.0",
    "google-auth-oauthlib>=1.2.2",
    "google-genai>=1.0.0",
    "o365>=2.1.9",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
]

[project.scripts]
calendar-agent = "calendar_agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
